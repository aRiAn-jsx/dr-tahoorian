{{define "header"}}<header class="site-header{{if eq .CurrentPath "/"}} site-header--home{{end}}">
    <nav class="site-nav" aria-label="منوی اصلی">
        <a href="/" class="brand-mark" aria-label="دکتر حسین طهوریان">
            <span class="brand-mark__symbol">
                <img class="brand-logo" src="/static/images/download%20(2).webp" alt="دکتر حسین طهوریان">
            </span>
            <span class="brand-mark__name">دکتر حسین طهوریان</span>
        </a>

        <div class="desktop-nav">
            <div class="nav-pill-track">
                <a href="/" class="nav-link{{if eq .CurrentPath "/"}} is-active{{end}}" {{if eq .CurrentPath "/"}}aria-current="page"{{end}}>
                    <span>خانه</span>
                </a>
                <a href="/about" class="nav-link{{if eq .CurrentPath "/about"}} is-active{{end}}" {{if eq .CurrentPath "/about"}}aria-current="page"{{end}}>
                    <span>درباره من</span>
                </a>
                <a href="/services" class="nav-link{{if or (eq .CurrentPath "/services") (hasPrefix .CurrentPath "/services/")}} is-active{{end}}" {{if or (eq .CurrentPath "/services") (hasPrefix .CurrentPath "/services/")}}aria-current="page"{{end}}>
                    <span>خدمات</span>
                </a>
                <a href="/articles" class="nav-link{{if or (eq .CurrentPath "/articles") (hasPrefix .CurrentPath "/articles/")}} is-active{{end}}" {{if or (eq .CurrentPath "/articles") (hasPrefix .CurrentPath "/articles/")}}aria-current="page"{{end}}>
                    <span>مقالات</span>
                </a>
                <a href="/projects" class="nav-link{{if eq .CurrentPath "/projects"}} is-active{{end}}" {{if eq .CurrentPath "/projects"}}aria-current="page"{{end}}>
                    <span>پروژه‌ها</span>
                </a>
                <a href="/team" class="nav-link{{if eq .CurrentPath "/team"}} is-active{{end}}" {{if eq .CurrentPath "/team"}}aria-current="page"{{end}}>
                    <span>تیم من</span>
                </a>
            </div>
        </div>

        <div class="header-actions">
            <a href="/contact" class="header-cta" title="شروع همکاری">
                <span>شروع همکاری</span>
                <i data-lucide="arrow-up-left" class="header-cta__icon" aria-hidden="true"></i>
            </a>
            <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="mobile-navigation" aria-label="باز کردن منو">
                <span class="menu-lines menu-lines--open" aria-hidden="true"><span></span><span></span></span>
                <span class="menu-lines menu-lines--close" aria-hidden="true"><span></span><span></span></span>
            </button>
        </div>
    </nav>
</header>
<button type="button" class="nav-overlay" tabindex="-1" aria-hidden="true"></button>
<div id="mobile-navigation" class="mobile-nav" role="dialog" aria-modal="true" aria-label="منوی اصلی">
    <div class="mobile-nav__handle" aria-hidden="true"><span></span></div>
    <div class="mobile-nav__heading"><span>منوی اصلی</span><small>دکتر حسین طهوریان</small></div>
    <a href="/" class="{{if eq .CurrentPath "/"}}is-active{{end}}" {{if eq .CurrentPath "/"}}aria-current="page"{{end}}><i data-lucide="house"></i><span>خانه</span><b>01</b></a>
    <a href="/about" class="{{if eq .CurrentPath "/about"}}is-active{{end}}" {{if eq .CurrentPath "/about"}}aria-current="page"{{end}}><i data-lucide="user-round"></i><span>درباره من</span><b>02</b></a>
    <a href="/services" class="{{if or (eq .CurrentPath "/services") (hasPrefix .CurrentPath "/services/")}}is-active{{end}}" {{if or (eq .CurrentPath "/services") (hasPrefix .CurrentPath "/services/")}}aria-current="page"{{end}}><i data-lucide="briefcase"></i><span>خدمات</span><b>03</b></a>
    <a href="/articles" class="{{if or (eq .CurrentPath "/articles") (hasPrefix .CurrentPath "/articles/")}}is-active{{end}}" {{if or (eq .CurrentPath "/articles") (hasPrefix .CurrentPath "/articles/")}}aria-current="page"{{end}}><i data-lucide="newspaper"></i><span>مقالات</span><b>04</b></a>
    <a href="/projects" class="{{if eq .CurrentPath "/projects"}}is-active{{end}}" {{if eq .CurrentPath "/projects"}}aria-current="page"{{end}}><i data-lucide="folder-kanban"></i><span>پروژه‌ها</span><b>05</b></a>
    <a href="/team" class="{{if eq .CurrentPath "/team"}}is-active{{end}}" {{if eq .CurrentPath "/team"}}aria-current="page"{{end}}><i data-lucide="users-round"></i><span>تیم من</span><b>06</b></a>
    <a href="/contact" class="{{if eq .CurrentPath "/contact"}}is-active{{end}}" {{if eq .CurrentPath "/contact"}}aria-current="page"{{end}}><i data-lucide="phone"></i><span>تماس با من</span><b>07</b></a>
    <div class="mobile-nav__footer"><span>شروع یک همکاری تازه</span><i data-lucide="sparkles"></i></div>
</div>
<div class="header-spacer" aria-hidden="true"></div>
{{end}}
